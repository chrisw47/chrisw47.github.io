{{ define "main" }}
<div class="container">

  <a class="back-link" href="{{ .Parent.RelPermalink }}">← {{ .Parent.Title }}</a>

  <article>
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <div class="post-meta">
        <time datetime="{{ .Site.Lastmod.Format "2006-01-02" }}">
          Current as of: {{ .Site.Lastmod.Format "January 2, 2006" }}
        </time>
      </div>
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>
  </article>

</div>
{{ end }}
